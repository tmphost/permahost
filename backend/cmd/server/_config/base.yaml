# Values here (and the environment) are defaults. Once root saves settings on
# the /setup page, the settings file overrides the app URL, sites domain, tls,
# credits, database, storage, s3, files and auth provider values below.
app:
  port: ${PERMAHOSTIO_PORT:2027}
  # Public URL of the app, e.g. https://app.permahost.io. Its host is the only
  # one the app answers on (besides localhost); OAuth callbacks are
  # <baseUrl>/auth/<provider>/callback. In local development point it
  # at the Vite dev server (http://localhost:5173).
  baseUrl: ${PERMAHOSTIO_BASE_URL:http://localhost:2027}
  # Parent domain of the dynamic subdomains f<11 characters>.<sitesDomain>,
  # e.g. permahost.io. Empty disables them.
  sitesDomain: ${PERMAHOSTIO_SITES_DOMAIN:}
  basePath: ${PERMAHOSTIO_BASE_PATH:}
  cookieSecure: ${PERMAHOSTIO_COOKIE_SECURE:false}
  settingsFile: ${PERMAHOSTIO_SETTINGS_FILE:./_storage/settings.json}
  # Comma-separated proxy IPs or CIDR ranges in front of the app, e.g.
  # 10.0.0.0/8. Requests from them count as coming from the client IP in
  # proxyHeader (the rightmost address that is not a trusted proxy):
  # anonymous uploads are limited per client IP.
  trustedProxies: ${PERMAHOSTIO_TRUSTED_PROXIES:}
  proxyHeader: ${PERMAHOSTIO_PROXY_HEADER:X-Forwarded-For}
# HTTPS terminated by the server with Let's Encrypt certificates, obtained
# and renewed automatically over TLS-ALPN-01 (Let's Encrypt must reach the
# HTTPS port as 443). lego also covers the dynamic subdomains: one certificate
# per subdomain on its first visit, or, with a Cloudflare API token, a single
# *.<sitesDomain> wildcard over DNS-01.
tls:
  enabled: ${PERMAHOSTIO_TLS_ENABLED:false}
  port: ${PERMAHOSTIO_TLS_PORT:443}
  email: ${PERMAHOSTIO_TLS_EMAIL:}
  lego:
    enabled: ${PERMAHOSTIO_TLS_LEGO_ENABLED:false}
    cloudflareApiToken: ${PERMAHOSTIO_TLS_LEGO_CLOUDFLARE_API_TOKEN:}
auth:
  jwtSecret: ${PERMAHOSTIO_AUTH_JWT_SECRET}
  # Unlocks /setup. Generated and logged at startup when empty.
  rootAccessToken: ${PERMAHOSTIO_AUTH_ROOT_ACCESS_TOKEN:}
  google:
    clientId: ${PERMAHOSTIO_AUTH_GOOGLE_CLIENT_ID}
    clientSecret: ${PERMAHOSTIO_AUTH_GOOGLE_CLIENT_SECRET}
  github:
    clientId: ${PERMAHOSTIO_AUTH_GITHUB_CLIENT_ID}
    clientSecret: ${PERMAHOSTIO_AUTH_GITHUB_CLIENT_SECRET}
credits:
  monthlyGrant: ${PERMAHOSTIO_CREDITS_MONTHLY_GRANT:250}
# PostgreSQL is used when enabled; otherwise SQLite.
sqlite:
  enabled: ${PERMAHOSTIO_SQLITE_ENABLED:true}
  dsn: ${PERMAHOSTIO_SQLITE_DSN:./_storage/permahost.db?_pragma=busy_timeout(5000)&_pragma=journal_mode(WAL)}
  maxIdleConns: 10
  maxOpenConns: 100
  maxConnLifetime: 1h
postgres:
  enabled: ${PERMAHOSTIO_POSTGRES_ENABLED:false}
  # postgres://user:password@host:5432/permahost?sslmode=disable
  dsn: ${PERMAHOSTIO_POSTGRES_DSN:}
  maxIdleConns: 10
  maxOpenConns: 100
  maxConnLifetime: 1h
# Where uploaded files live: "local" (localPath on disk) or "s3".
storage:
  driver: ${PERMAHOSTIO_STORAGE_DRIVER:local}
  localPath: ${PERMAHOSTIO_STORAGE_LOCAL_PATH:./_storage/files}
s3:
  endpoint: ${PERMAHOSTIO_S3_ENDPOINT:}
  region: ${PERMAHOSTIO_S3_REGION:}
  bucket: ${PERMAHOSTIO_S3_BUCKET:}
  accessKeyId: ${PERMAHOSTIO_S3_ACCESS_KEY_ID:}
  secretAccessKey: ${PERMAHOSTIO_S3_SECRET_ACCESS_KEY:}
  usePathStyle: ${PERMAHOSTIO_S3_USE_PATH_STYLE:false}
files:
  # Largest upload per request, and the lifetime of a folder made without
  # signing in. An account's folders do not expire.
  maxUploadMb: ${PERMAHOSTIO_FILES_MAX_UPLOAD_MB:16}
  anonymousMaxTtlMinutes: ${PERMAHOSTIO_FILES_ANONYMOUS_MAX_TTL_MINUTES:10}
  # Folders are served at <baseUrl>/files/<userId>/<folderId>/, or with
  # subdomains on, at f<folderId>.<publicDomain> (needs a wildcard DNS record
  # and certificate). publicDomain defaults to the sites domain, else the
  # baseUrl host; *.localhost resolves to 127.0.0.1 in browsers, so it works
  # locally as is.
  subdomains: ${PERMAHOSTIO_FILES_SUBDOMAINS:false}
  publicDomain: ${PERMAHOSTIO_FILES_PUBLIC_DOMAIN:}
# Resolvers custom domains' CNAME records are looked up with, as a
# comma-separated host:port list; empty asks 1.1.1.1 and 8.8.8.8.
dns:
  resolvers: ${PERMAHOSTIO_DNS_RESOLVERS:}
idgen:
  node: ${PERMAHOSTIO_MONOFLAKE_NODE:0}
